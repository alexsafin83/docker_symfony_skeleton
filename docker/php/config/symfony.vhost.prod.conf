<VirtualHost *:80 *:443>
    ServerName %servername%
    ServerAlias %servername%

    DocumentRoot /var/www/html/
    <Directory /var/www/html/>
        AllowOverride None
        Require all granted
        FallbackResource /public/index.php

        RewriteEngine on

        # root request (var/www/html/) to /public folder
        RewriteRule ^$ /public

        # If request doesnt contain /public
        RewriteCond %{REQUEST_URI} !^/public
        # forward it to public/index.php
        RewriteRule . /public/index.php


        # If the path points inside the public folder
        RewriteCond %{REQUEST_URI} ^/public/.
        # and there is a file at that path
        RewriteCond %{REQUEST_FILENAME} -f
        # use that file.
        RewriteRule ^ - [L]

        # If the url points to /public use the Symfony index.php.
        RewriteRule ^/public(/.*)?$ /public/index.php

        # If the path points to something which is no existing file or directory
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /public/index.php

    </Directory>

    ErrorLog /var/log/apache2/symfony_error.log
    CustomLog /var/log/apache2/symfony_access.log combined
</VirtualHost>