<VirtualHost *:80 *:443>
    ServerName localhost
    ServerAlias localhost

    AddDefaultCharset utf-8
    AddCharset utf-8 .css .js

    DocumentRoot /var/www/html/
    <Directory /var/www/html/>
        AllowOverride None
        Require all granted
        FallbackResource /public/index.php

        RewriteEngine on

        # root request (var/www/html/) to /public folder
        RewriteRule ^$ /public

        # If request contain css, js, fonts or images path
        RewriteCond %{REQUEST_URI} ^/css/ [OR]
        RewriteCond %{REQUEST_URI} ^/js/ [OR]
        RewriteCond %{REQUEST_URI} ^/javascript/ [OR]
        RewriteCond %{REQUEST_URI} ^/fonts/ [OR]
        RewriteCond %{REQUEST_URI} ^/images/
        # forward it to /public/...
        RewriteRule ^(.*)$ /public/$1 [L]

        # If the path points inside the public folder
        RewriteCond %{REQUEST_URI} ^/public/.
        # and there is a file at that path
        RewriteCond %{REQUEST_FILENAME} -f
        # use that file.
        RewriteRule ^ - [L]

        # If the url points to /public use the Symfony index.php.
        RewriteRule ^/public(/.*)?$ /public/index.php [B,QSA]

        # If the path points to something which is no existing file or directory
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /public/index.php [B,QSA]

    </Directory>

    ErrorLog /var/log/apache2/symfony_error.log
    CustomLog /var/log/apache2/symfony_access.log combined
</VirtualHost>